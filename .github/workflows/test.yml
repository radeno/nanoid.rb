name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported release, then the last minor of each newer line.
        ruby:
          - "2.0.0"
          - "2.7"
          - "3.4"
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # Latest Bundler that this Ruby can run. The lockfile's Bundler
          # 2.5 does not install on Ruby 2.0.
          bundler: latest
      - name: Install dependencies
        run: |
          # One lockfile cannot satisfy both Ruby 2.0 and current Ruby.
          # The gemspec pins the dev gems, so resolving here is stable.
          rm -f Gemfile.lock
          bundle install --jobs 4 --retry 3
      - name: Run tests
        run: bundle exec rake test
