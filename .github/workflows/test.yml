name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported release, then the last minor of the current line.
        ruby:
          - "3.3"
          - "3.4"
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test
